name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Context Hyperdrive Test Suite
        run: |
          python test_hyperdrive.py
      - name: Verify All 7 Engines & Unified Pipeline
        run: |
          python scripts/hyperdrive_pipeline.py
          python scripts/shrinkwrap_ast.py --demo
          python scripts/cache_aligner.py
          python scripts/intent_amplifier.py --demo
          python scripts/log_quantizer.py --demo
          python scripts/diff_compactor.py --demo
          python scripts/token_circuit_breaker.py
          python scripts/history_compactor.py
          python scripts/hyperdrive_universal_hook.py --demo
