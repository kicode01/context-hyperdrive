<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)" />

  <!-- Grid Lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="900" y1="0" x2="900" y2="600" />
    <line x1="1100" y1="0" x2="1100" y2="600" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
  </g>

  <!-- Title Badge -->
  <rect x="420" y="30" width="360" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="445" cy="50" r="6" fill="#06b6d4" />
  <text x="465" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1">
    CONTEXT-HYPERDRIVE ARCHITECTURE
  </text>

  <!-- LEFT: Short Terse Prompt Input -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <rect width="280" height="420" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="24" width="120" height="28" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1" />
    <text x="32" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#60a5fa">USER PROMPT</text>
    
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Terse &amp; Minimal</text>
    <text x="20" y="115" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Short 3-5 word commands</text>

    <!-- Prompt Box -->
    <rect x="20" y="145" width="240" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="35" y="175" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#38bdf8">"fix refund bug"</text>
    <text x="35" y="198" font-family="Consolas, monospace" font-size="11" fill="#64748b">(Only 3 words / 4 tokens)</text>

    <!-- Without Hyperdrive Warning -->
    <rect x="20" y="245" width="240" height="150" rx="8" fill="#1e1b2e" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4,4" />
    <text x="35" y="275" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#fb7185">WITHOUT HYPERDRIVE:</text>
    <text x="35" y="300" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">• High Reasoning burns 8k tokens</text>
    <text x="35" y="322" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">• 35-second thinking latency</text>
    <text x="35" y="344" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Raw 2k-line file dump</text>
    <text x="35" y="366" font-family="-apple-system, sans-serif" font-size="11" fill="#f43f5e">• Rapid 429 quota exhaustion</text>
  </g>

  <!-- CONNECTOR 1 -->
  <path d="M 340 310 L 410 310" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,6" fill="none" />
  <polygon points="415,310 405,304 405,316" fill="#06b6d4" />

  <!-- CENTER: 3-Pillar Hyperdrive Engine -->
  <g transform="translate(420, 100)" filter="url(#shadow)">
    <rect width="360" height="420" rx="16" fill="url(#cardGrad)" stroke="url(#cyanGlow)" stroke-width="2" />
    
    <rect x="24" y="24" width="160" height="28" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
    <text x="36" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#22d3ee">HYPERDRIVE ENGINE</text>
    <text x="24" y="85" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Tri-Core Optimization</text>

    <!-- Pillar 1: Intent Amplifier -->
    <rect x="24" y="110" width="312" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="44" cy="132" r="8" fill="#8b5cf6" />
    <text x="41" y="136" font-family="Consolas" font-size="11" font-weight="bold" fill="#ffffff">1</text>
    <text x="62" y="136" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#c084fc">Intent Amplifier</text>
    <text x="62" y="155" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Bypasses reasoning tax via Git &amp; Error introspection</text>
    <text x="62" y="172" font-family="Consolas, monospace" font-size="10" fill="#38bdf8">Target: SettlementEngine.process_refund</text>

    <!-- Pillar 2: AST Shrinkwrap -->
    <rect x="24" y="195" width="312" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="44" cy="217" r="8" fill="#06b6d4" />
    <text x="41" y="221" font-family="Consolas" font-size="11" font-weight="bold" fill="#ffffff">2</text>
    <text x="62" y="221" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">AST Context Shrinkwrapper</text>
    <text x="62" y="240" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Stubs non-focal code &amp; docstrings (75% reduction)</text>
    <text x="62" y="257" font-family="Consolas, monospace" font-size="10" fill="#34d399">Saved: 1,850 non-target code tokens</text>

    <!-- Pillar 3: Deterministic Cache Aligner -->
    <rect x="24" y="280" width="312" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="44" cy="302" r="8" fill="#10b981" />
    <text x="41" y="306" font-family="Consolas" font-size="11" font-weight="bold" fill="#ffffff">3</text>
    <text x="62" y="306" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">Prompt Cache Aligner</text>
    <text x="62" y="325" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Pins &gt;=1024 token immutable prefix (SHA-256)</text>
    <text x="62" y="342" font-family="Consolas, monospace" font-size="10" fill="#facc15">Cache Hit: 90% Provider Price Discount</text>

    <!-- Status Bar -->
    <rect x="24" y="370" width="312" height="32" rx="6" fill="#1e293b" />
    <circle cx="40" cy="386" r="4" fill="#10b981" />
    <text x="54" y="390" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">Execution Time: &lt; 2.5ms | Zero Token Cost</text>
  </g>

  <!-- CONNECTOR 2 -->
  <path d="M 780 310 L 850 310" stroke="#10b981" stroke-width="3" stroke-dasharray="6,6" fill="none" />
  <polygon points="855,310 845,304 845,316" fill="#10b981" />

  <!-- RIGHT: High-IQ Optimized Result -->
  <g transform="translate(860, 100)" filter="url(#shadow)">
    <rect width="280" height="420" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    
    <rect x="20" y="24" width="130" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="32" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">HIGH-IQ OUTPUT</text>

    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Max Performance</text>
    <text x="20" y="115" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Sub-second high-precision fix</text>

    <!-- Metrics Cards -->
    <rect x="20" y="145" width="240" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="35" y="170" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">TOKEN REDUCTION</text>
    <text x="35" y="193" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#38bdf8">75% - 85% LESS</text>

    <rect x="20" y="215" width="240" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="35" y="240" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">API COST SAVINGS</text>
    <text x="35" y="263" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#34d399">90% SAVED (CACHED)</text>

    <rect x="20" y="285" width="240" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="35" y="310" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">SPEED ACCELERATION</text>
    <text x="35" y="333" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#facc15">8x - 15x FASTER</text>

    <rect x="20" y="355" width="240" height="50" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1" />
    <text x="35" y="385" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#4ade80">✓ ZERO RATE-LIMIT HITS</text>
  </g>
</svg>
